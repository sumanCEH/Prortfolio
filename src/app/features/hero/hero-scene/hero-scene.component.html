<div class="scene" aria-hidden="true" [attr.data-live]="live()">
  <canvas #canvas class="scene__canvas"></canvas>

  @if (showLog()) {
    <!-- Decorative: mirrors the request being animated on the canvas. -->
    <div class="trace">
      <div class="trace__bar">
        <span class="trace__lights"><i></i><i></i><i></i></span>
        <span class="trace__title">request-trace</span>
      </div>
      <p class="trace__req" [class.on]="step() >= 0">
        <span class="trace__arrow">→</span> <b>POST</b> /api/orders
      </p>
      <ol class="trace__lines">
        @for (l of log; track l.service; let i = $index) {
          <li [class.on]="step() >= i + 1" [class.now]="step() === i + 1">
            <span class="trace__check">✓</span>
            <span class="trace__svc">{{ l.service }}</span>
            <span class="trace__msg">{{ l.message }}</span>
            <span class="trace__ms">{{ l.ms }}</span>
          </li>
        }
      </ol>
      <p class="trace__done" [class.on]="step() === 6">
        <span class="trace__badge">201</span> Created <span class="trace__ms">42ms total</span>
      </p>
    </div>
  }
</div>
